aid: realyse
name: REalyse
description: >-
  REalyse is a UK residential property data platform that aggregates more than
  100 data sources into geospatial analysis and market-intelligence tools for
  developers, lenders, investors, consultants, and funds. Its data spans five
  domains — Planning & Policy, Demographics, Market (rental and sales pricing,
  yields, days on market, comparables), Land & Ownership, and Amenities. REalyse
  offers a data API for institutions that require a constant feed of property
  data, alongside the REalyse Core geospatial platform, the REalyse Pulse
  consumer AI valuation product, and downloadable Market Intelligence reports.
  The company is based in London and is backed by Anthemis. API access is
  onboarded through the sales team rather than a self-service developer portal,
  so no public OpenAPI, base URL, or authentication reference is published.
